[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepali-summarizer"
version = "0.1.0"
description = "Nepali text summarization project"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
    "PyYAML>=6.0.0",
    "scikit-learn>=1.5.0",
    "regex>=2024.5.15",
    "unicodedata2>=15.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "tokenizers>=0.19.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "litellm>=1.102.1",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]

[project.scripts]
clean-data = "scripts.clean_data:main"
generate-summaries = "scripts.generate_summaries:main"
nepali-summarizer = "src.main:main"
train-nepali-bpe = "scripts.train_nepali_bpe:main"
train-model = "scripts.train_model:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "src*"]
exclude = ["data*", "documents*", "notebooks*", "reports*"]
