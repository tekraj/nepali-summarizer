# Project configuration
# Paths are relative to the project root.

project:
  name: nepali-summarizer
  version: 0.1.0

training:
  # B. Every block caches its activations for backprop; the attention weights alone are
  # B x 8 x 512 x 512 floats per block, so B=16 needs several GB of RAM. Raise if you have it.
  batch_size: 4
  epochs: 10
  learning_rate: 0.0001
  max_grad_norm: 1.0
  seed: 42
  checkpoint_dir: checkpoints

data:
  # One training sample = <s> article </s> summary </s>, so T <= 768 + 256 = 1024.
  max_article_length: 768    # <s> + article + </s>; the article's right side is truncated to fit
  max_summary_length: 256    # summary + </s>; loss is computed only over these tokens
  max_sequence_length: 1024  # T cap for the positional encoding (article + summary)
  source_dir: data/raw
  cleaned_dir: data/cleaned  # articles: {filename}.txt
  summary_dir: data/summary  # targets:  {filename}-summary.txt
  processed_dir: data/processed
  vocab_dir: data/nepali_vocab_output   # vocab.json + merges.txt from train-nepali-bpe

model:
  d_model: 512      # D
  num_heads: 8      # H  (Dh = D / H = 64)
  num_layers: 6     # N stacked EncoderBlocks
  d_ff: 2048        # D_ff = 4 * D
  tie_weights: false
